<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xfit Gym</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e11d2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="icon" type="image/png" href="icons/icon-192.png">

<style>
:root{--pink:#e11d2e;--pink-d:#b3131f;--pink-l:#fde8ea;--bg:#fff;--card:#fff;--text:#2b2b33;--mute:#8b8b99;--line:#f1d9db}
@media (prefers-color-scheme:dark){:root{--bg:#17131a;--card:#221b27;--text:#f4eef6;--mute:#a79fb0;--line:#3a2c42;--pink-l:#3a2030}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:150px}
header.top{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 6px}
.logo-t{font-size:24px;font-weight:900;letter-spacing:1.5px;background:linear-gradient(135deg,var(--pink),#3a3a44);-webkit-background-clip:text;background-clip:text;color:transparent}
#langBtn{background:var(--pink-l);color:var(--pink);border:none;border-radius:20px;padding:7px 15px;font:inherit;font-size:13px;font-weight:800;cursor:pointer}
.view{display:none;padding:18px}.view.on{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{background:var(--card);border:1px solid var(--line);box-shadow:0 6px 18px rgba(225,29,46,.10);border-radius:22px;padding:18px 10px;text-align:center;color:var(--text);font:inherit;font-weight:800;cursor:pointer}
.tile .ic{display:flex;align-items:center;justify-content:center;width:56px;height:56px;margin:0 auto 10px;border-radius:18px;background:linear-gradient(135deg,#ff6b76,#e11d2e);font-size:28px;box-shadow:0 6px 14px rgba(225,29,46,.35)}
.tile.wide{grid-column:1/-1;display:flex;align-items:center;gap:14px;text-align:start;padding:14px 16px}
.tile.wide .ic{margin:0;flex:0 0 auto}
.tile.wide small{display:block;font-weight:500;color:var(--mute);font-size:12px;margin-top:2px}
.hero{position:relative;overflow:hidden;border-radius:28px;padding:26px 20px 22px;color:#fff;background:linear-gradient(135deg,#ff4d5a 0%,#b3131f 52%,#1a1a1f 100%);box-shadow:0 14px 30px rgba(179,19,31,.35);margin-bottom:18px}
.hero::before{content:"";position:absolute;width:210px;height:210px;border-radius:50%;background:rgba(255,255,255,.12);top:-70px;inset-inline-end:-60px}
.hero::after{content:"";position:absolute;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.10);bottom:-50px;inset-inline-start:-30px}
.hero>*{position:relative;z-index:1}
.hero .kick{font-size:13px;font-weight:800;letter-spacing:1px;opacity:.9}
.hero h1{font-size:30px;line-height:1.15;font-weight:900;margin:6px 0 10px}
.hero .quote{min-height:46px;font-size:15px;opacity:.95;transition:opacity .4s}
.hero .cta{margin-top:14px;background:#fff;color:var(--pink-d);border:none;border-radius:16px;padding:13px 22px;font:inherit;font-weight:900;font-size:16px;cursor:pointer;box-shadow:0 8px 18px rgba(0,0,0,.18)}
.hero .big{position:absolute;font-size:92px;inset-inline-end:14px;bottom:6px;opacity:.95;z-index:1;transform:rotate(-8deg)}
.sec-t{font-size:15px;font-weight:900;margin:4px 2px 10px}
.chips{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 12px;margin-bottom:6px}
.tchip{flex:0 0 auto;min-width:112px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:11px 14px;text-align:center;font:inherit;color:var(--text);cursor:pointer;box-shadow:0 4px 12px rgba(225,29,46,.08)}
.tchip b{display:block;color:var(--pink);font-size:17px}
.tchip span{font-size:13px;font-weight:700}
.nochip{color:var(--mute);font-size:14px;padding:8px 2px 14px}
.chal{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,var(--pink-l),var(--card));border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:18px}
.chal .e{font-size:40px}
.chal .tx{flex:1}
.chal .tx small{color:var(--pink);font-weight:900;letter-spacing:.5px}
.chal .tx div{font-weight:800;margin-top:2px}
.chal button{border:none;border-radius:14px;background:var(--pink);color:#fff;font:inherit;font-weight:800;padding:10px 14px;cursor:pointer}
.chal.done button{background:#1a9d4a}
h2{font-size:18px;margin-bottom:12px;color:var(--pink)}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:8px}
.day{flex:0 0 auto;min-width:58px;padding:9px 6px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:13px;cursor:pointer;text-align:center}
.day.on{background:var(--pink);color:#fff;border-color:var(--pink)}
.cls{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.cls .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px}
.cls .name{font-weight:800;color:var(--pink);font-size:17px}
.cls .meta{color:var(--mute);font-size:13px;line-height:1.8}
.badge{font-size:12px;border-radius:10px;padding:2px 8px;background:var(--pink-l);color:var(--pink);font-weight:700;white-space:nowrap}
.btn{display:inline-block;background:var(--pink);color:#fff;border:none;border-radius:12px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;margin-top:8px}
.cls.off{opacity:.75}
.badge.off{background:#eee;color:#777}
.btn.off{background:#bbb;cursor:not-allowed}
.btn.alt{background:transparent;color:var(--pink);border:1px solid var(--pink)}
.full{background:#bbb!important;pointer-events:none}
.empty{text-align:center;color:var(--mute);padding:40px 0}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
summary{padding:14px;font-weight:700;cursor:pointer;color:var(--pink);list-style:none}
summary::-webkit-details-marker{display:none}
details ul{padding:0 14px 14px;margin-inline-start:18px;line-height:2}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--line);display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:none;font:inherit;font-size:11px;color:var(--mute);cursor:pointer}
nav button .ic{display:block;font-size:22px}
nav button.on{color:var(--pink);font-weight:700}
.fab{position:fixed;bottom:84px;left:16px;width:54px;height:54px;border-radius:50%;background:#25d366;color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet h3{color:var(--pink);margin-bottom:4px}
.sheet input{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;font:inherit;background:var(--card);color:var(--text);margin-top:10px}
.msg{margin-top:10px;font-size:14px;min-height:20px}
.rv-sub{color:var(--mute);font-size:14px;margin:-6px 0 14px}
.rv-avatars{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 12px}
.rv-av{flex:0 0 auto;background:none;border:none;font:inherit;color:var(--text);text-align:center;cursor:pointer;width:72px}
.rv-c{position:relative;display:flex;align-items:center;justify-content:center;width:64px;height:64px;margin:0 auto 6px;border-radius:50%;background:var(--pink-l);font-size:28px;border:3px solid transparent;transition:.2s}
.rv-av.on .rv-c{border-color:var(--pink);transform:scale(1.08);background:linear-gradient(135deg,var(--pink),#ff9ac0)}
.rv-c i{position:absolute;bottom:-2px;right:-2px;background:#1a9d4a;color:#fff;font-style:normal;font-size:12px;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.rv-n{font-size:13px;font-weight:700}
.rv-card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 16px;text-align:center;position:relative;overflow:hidden}
.rv-card.new{animation:rvIn .3s ease}
@keyframes rvIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rv-hint{text-align:center;color:var(--mute);padding:30px 0}
.rv-who{font-size:20px;font-weight:800;color:var(--pink)}
.rv-face{font-size:64px;line-height:1.2;margin-top:6px}
.rv-label{font-weight:800;min-height:24px}
.rv-stars{display:flex;justify-content:center;gap:4px;direction:ltr;margin:10px 0 14px}
.rv-s{background:none;border:none;font-size:44px;line-height:1;color:var(--line);cursor:pointer;padding:0 2px;transition:transform .15s,color .15s}
.rv-s.on{color:#f5a623;transform:scale(1.12)}
.rv-s:active{transform:scale(1.4)}
.rv-tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:14px}
.rv-tag{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:20px;padding:8px 13px;font:inherit;font-size:13px;cursor:pointer}
.rv-tag.on{background:var(--pink);border-color:var(--pink);color:#fff}
.rv-in{width:100%;padding:12px;border:1px solid var(--line);border-radius:14px;font:inherit;background:var(--bg);color:var(--text);margin-top:8px;resize:none}
.rv-send{width:100%;margin-top:14px;padding:14px;border:none;border-radius:16px;background:linear-gradient(135deg,var(--pink),var(--pink-d));color:#fff;font:inherit;font-weight:800;font-size:16px;cursor:pointer}
.rv-send:disabled{opacity:.6}
.rv-msg{min-height:20px;margin-top:8px;font-size:14px}
.rv-thanks{font-size:22px;font-weight:800;color:var(--pink);margin:8px 0}
.rv-conf{position:absolute;top:-20px;font-size:20px;animation:rvFall 2.4s ease-in forwards;pointer-events:none}
@keyframes rvFall{to{transform:translateY(420px) rotate(360deg);opacity:0}}
.nxt{display:none;background:linear-gradient(135deg,#fff,var(--pink-l));border:1px solid var(--line);border-radius:22px;padding:16px;margin:0 0 18px}
.nxt.on{display:block}
.nxt .k{font-size:12px;font-weight:900;letter-spacing:.5px;color:var(--pink)}
.nxt .n{font-size:18px;font-weight:900;margin:4px 0 2px}
.nxt .w{font-size:13px;color:var(--mute)}
.nxt .cd{display:inline-block;margin:10px 0 6px;background:var(--pink);color:#fff;border-radius:14px;padding:8px 14px;font-weight:900;font-size:16px}
.nxt .e{font-size:14px;font-weight:700}
.btn.booked{background:transparent;color:var(--pink);border:1px solid var(--pink);cursor:default}
html.gate body{display:none}
.who{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--pink-l);font-weight:700;line-height:1.8}
</style>
<script>document.documentElement.classList.add("gate")</script>
</head>

<section class="view" id="schedule">

<section class="view" id="workout">

<section class="view" id="inbody">

<section class="view" id="rate">

<section class="view" id="coach">

<section class="view" id="adm" dir="rtl">

</section>

<div class="modal" id="modal"><div class="sheet">

  <div id="mWho" class="who" style="display:none"></div>
  <input id="mName" data-ph="phName" autocomplete="name">
  <input id="mPhone" data-ph="phPhone" inputmode="tel" autocomplete="tel">
  <div class="msg" id="mMsg"></div>
  <button class="btn" id="mSend" data-i="confirm"></button>
  <button class="btn alt" id="mClose" data-i="cancel"></button>
</div></div>

<a class="fab" id="fab" target="_blank" rel="noopener" aria-label="WhatsApp">💬</a>

<nav>
  <button data-go="home" class="on"><span class="ic">🏠</span><span data-i="nHome"></span></button>
  <button data-go="schedule"><span class="ic">📅</span><span data-i="nClasses"></span></button>

  <button data-go="adm" id="navAdmin" style="display:none"><span class="ic">⚙️</span><span>الأدمن</span></button>
</nav>

const DOW={"الأحد":0,"الاثنين":1,"الثلاثاء":2,"الأربعاء":3,"الخميس":4,"الجمعة":5,"السبت":6};
function nextDate(day,time){
  const now=new Date(),[hh,mm]=time.split(":").map(Number);
  const d=new Date(now.getFullYear(),now.getMonth(),now.getDate(),hh,mm);
  d.setDate(d.getDate()+((DOW[day]-now.getDay()+7)%7));
  if(d<now)d.setDate(d.getDate()+7);
  return d;
}

const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

    if(Array.isArray(c.coaches))EXTRA_COACHES=[...new Set([...MEN_COACHES,...c.coaches.filter(Boolean)])];
    if(c.spots){

function serverErr(s){
  const x=String(s||"").toLowerCase();
  if(x==="cancelled")return t("sCancelled");
  if(x==="full"||x.includes("مكتمل"))return t("sFull");
  if(x==="dup"||x==="duplicate"||x.includes("حاجز"))return t("sDup");
  return t("err");
}
/* Jordanian mobile: 07[789]xxxxxxx, also accepts +962 / 00962 / 962 prefixes */
function normPhone(p){
  let d=String(p).replace(/[٠-٩]/g,c=>"٠١٢٣٤٥٦٧٨٩".indexOf(c)).replace(/\D/g,"");
  if(d.startsWith("00962"))d=d.slice(5);
  else if(d.startsWith("962"))d=d.slice(3);
  if(d.startsWith("7"))d="0"+d;
  return /^07[789]\d{7}$/.test(d)?d:null;
}

function addMy(list){

  pruneMy();saveMy();renderNext();renderClasses();

/* بيطابق حجوزات الجهاز مع اللي بـ Firestore (المرجع): أي حجز انمسح من الأدمن بيروح كمان من هون.
   بنخلّي الحجوزات اللي انعملت من أقل من 3 دقايق (ممكن لسا ما انكتبت بـ Firestore) */
function syncMy(list){
  list=Array.isArray(list)?list:[];
  const keys=new Set(list.map(b=>b&&b.key).filter(Boolean));
  const fresh=MY.filter(b=>b&&!keys.has(b.key)&&b.at&&Date.now()-new Date(b.at).getTime()<180000);
  MY=[];addMy(list.concat(fresh));
}

function fmtLeft(ms){
  const m=Math.max(0,Math.floor(ms/60000)),d=Math.floor(m/1440),h=Math.floor(m%1440/60),mi=m%60,p=[];
  if(d)p.push(d+" "+t("dU"));
  if(d||h)p.push(h+" "+t("hU"));
  if(!d)p.push(mi+" "+t("mU"));
  return p.join(" ");
}

function pushState(){
  if(!("Notification" in window)||!("serviceWorker" in navigator)||!("PushManager" in window)){
    const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
    const app=navigator.standalone||(matchMedia&&matchMedia("(display-mode: standalone)").matches);
    return ios&&!app?"ios":"none";
  }
  const p=Notification.permission;return p==="granted"?"on":p==="denied"?"denied":"off";
}
function pushLine(){
  const s=pushState();

  return `<div class="w" style="margin-top:8px">${t({on:"pOn",ios:"pIos",denied:"pDen"}[s])}</div>`;
}

async function cancelBooking(key){
  const b=MY.find(x=>x.key===key);if(!b)return;
  if(cancelLocked(b)){alert(lockMsg());return}
  if(!confirm(t("cancelAsk").replace("{c}",b.cls+" "+b.time)))return;
  const p=window.xfitProfile;let phone=p&&normPhone(p.phone||"");
  if(!phone){phone=normPhone(prompt(t("phPhone"))||"");if(!phone)return}
  try{
    const r=await api({action:"cancel",key,phone});
    if(r.ok||r.error==="notfound"){
      MY=MY.filter(x=>x.key!==key);saveMy();
      try{window.xfitOnCancelled&&window.xfitOnCancelled(key)}catch(e){}
      if(r.ok)notify("إلغاء حجز - "+b.cls,{"الحصة":b.cls,"اليوم":(b.day||"")+" "+b.time,"الاسم":(p&&p.name)||"","الرقم":phone});
      loadCounts();renderNext();renderClasses();
      alert(t("cancelOk"));
    }else alert(r.error==="locked"?lockMsg():t("cancelFail"));
  }catch(e){alert(t("cancelFail"))}
}

      notify("حجز جديد - "+pending.c[0],{"الحصة":pending.c[0],"اليوم":pending.day+" "+pending.c[1],"الاسم":name,"الرقم":phone})}
    else{m.style.color="#d33";m.textContent=serverErr(r.error)}
  }catch(e){m.style.color="#d33";m.textContent=t("noConn")}
  $("#mSend").disabled=false;
};

/* ----- workout plan ----- */
function renderPlan(){
  $("#plan").innerHTML=PLAN.map(d=>`<details><summary>${d[L]}</summary><ul>${d.items.map(([n,mc])=>`<li><bdi>${n}</bdi> – <bdi>${mc?t("machine")+" "+mc:t("free")}</bdi></li>`).join("")}</ul></details>`).join("");
}

/* ----- coach rating ----- */
function coachNames(){const s=new Set();Object.values(SCHEDULE).forEach(l=>l.forEach(c=>s.add(c[3])));EXTRA_COACHES.forEach(n=>s.add(n));return Array.from(s)}
const RV_EMO=["💪","🔥","✨","⚡","🏆","🎯"];
const RV_FACE=["","😞","😕","🙂","😊","🤩"];
const rv={sel:null,stars:{},tags:{},text:{},nm:{},done:{},cf:{}};   /* tags stored as indexes */
function rvAvatars(){
  $("#rvAv").innerHTML=coachNames().map((n,i)=>`<button class="rv-av ${rv.sel===i?"on":""}" data-rv="${i}"><span class="rv-c">${RV_EMO[i%RV_EMO.length]}${rv.done[i]?"<i>✓</i>":""}</span><span class="rv-n">${n}</span></button>`).join("");
}
function rvPanel(anim){
  const i=rv.sel,P=$("#rvPanel");
  if(i===null){P.innerHTML=`<div class="rv-hint">${t("rvHint")}</div>`;return}
  const n=coachNames()[i],st=rv.stars[i]||0;
  if(rv.done[i]){
    P.innerHTML=`<div class="rv-card new" id="rvCard"><div class="rv-face">🥰</div><div class="rv-thanks">${t("rvThanks")}</div>
    <div class="rv-label">${t("rvThanks2")}</div><button class="rv-send" data-rvback="1">${t("rvAnother")}</button></div>`;
    if(!rv.cf[i]){rv.cf[i]=true;rvConfetti()}return;
  }
  const bad=st&&st<=2,tags=bad?T[L].tagsBad:T[L].tagsGood,chosen=rv.tags[i]||[];
  P.innerHTML=`<div class="rv-card ${anim?"new":""}"><div class="rv-who">${n}</div>
    <div class="rv-face">${RV_FACE[st]||"💭"}</div><div class="rv-label">${t("rvLabel")[st]}</div>
    <div class="rv-stars">${[1,2,3,4,5].map(v=>`<button class="rv-s ${v<=st?"on":""}" data-rvs="${v}" aria-label="${v}">★</button>`).join("")}</div>
    ${st?`<div class="rv-tags">${tags.map((tg,k)=>`<button class="rv-tag ${chosen.includes(k)?"on":""}" data-rvt="${k}">${tg}</button>`).join("")}</div>`:""}
    <textarea class="rv-in" id="rvText" rows="2" maxlength="200" placeholder="${t("rvOpt")}">${rv.text[i]||""}</textarea>
    <input class="rv-in" id="rvName" maxlength="60" placeholder="${t("rvNameP")}" value="${rv.nm[i]||""}">
    <div class="rv-msg" id="rvMsg"></div>
    <button class="rv-send" id="rvSend">${t("rvSend")}</button></div>`;
}
function rvConfetti(){
  const c=$("#rvCard");if(!c)return;const e=["💪","✨","⭐","🔥","🎉"];
  for(let k=0;k<26;k++){const s=document.createElement("span");s.className="rv-conf";
    s.textContent=e[k%e.length];s.style.left=(Math.random()*95)+"%";s.style.animationDelay=(Math.random()*0.8)+"s";c.appendChild(s)}
}
document.addEventListener("input",e=>{
  if(rv.sel===null)return;
  if(e.target.id==="rvText")rv.text[rv.sel]=e.target.value;
  if(e.target.id==="rvName")rv.nm[rv.sel]=e.target.value;
});
document.addEventListener("click",async e=>{
  const a=e.target.closest("[data-rv]");
  if(a){rv.sel=+a.dataset.rv;rvAvatars();rvPanel(true);return}
  if(e.target.closest("[data-rvback]")){rv.sel=null;rvAvatars();rvPanel();return}
  const i=rv.sel;if(i===null)return;
  const s=e.target.closest("[data-rvs]");
  if(s){const v=+s.dataset.rvs;if(((rv.stars[i]||0)<=2)!==(v<=2))rv.tags[i]=[];rv.stars[i]=v;rvPanel();return}
  const tg=e.target.closest("[data-rvt]");
  if(tg){const k=+tg.dataset.rvt,l=rv.tags[i]||(rv.tags[i]=[]),x=l.indexOf(k);x>=0?l.splice(x,1):l.push(k);rvPanel();return}
  if(e.target.id==="rvSend"){
    const m=$("#rvMsg"),btn=e.target;
    if(!rv.stars[i]){m.style.color="#d33";m.textContent=t("rvStarsFirst");return}
    /* tags are always sent in Arabic so the owner's emails stay consistent */
    const arTags=(rv.stars[i]<=2?T.ar.tagsBad:T.ar.tagsGood),picked=(rv.tags[i]||[]).map(k=>arTags[k]).filter(Boolean);
    const txt=(rv.text[i]||"").trim();
    const comment=(picked.join(" • ")+(txt?" | "+txt:"")).slice(0,300);
    m.style.color="var(--mute)";m.textContent=t("rvSending");btn.disabled=true;
    try{
      const r=await api({action:"rate",coach:coachNames()[i],stars:rv.stars[i],comment,name:(rv.nm[i]||"").trim()});
      if(r.ok){
        notify("تقييم جديد - "+coachNames()[i]+" ("+rv.stars[i]+"/5)",{"الكوتش":coachNames()[i],"التقييم":rv.stars[i]+" من 5","التعليق":comment||"-","الاسم":(rv.nm[i]||"").trim()||"بدون اسم"});
        rv.done[i]=true;rvAvatars();rvPanel();return}
      m.style.color="#d33";m.textContent=serverErr(r.error);
    }catch(err){m.style.color="#d33";m.textContent=t("noConn")}
    btn.disabled=false;
  }
});

/* ----- home: motivation, today strip, daily challenge ----- */
const DAY_BY_NUM=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
let qi=Math.floor(Math.random()*6),qTimer=null;
function showQuote(){
  const q=$("#quote");q.style.opacity=0;
  setTimeout(()=>{q.textContent=T[L].quotes[qi%T[L].quotes.length];q.style.opacity=1},250);
}
function renderToday(){
  const now=new Date(),dk=DAY_BY_NUM[now.getDay()],list=(SCHEDULE[dk]||[]).filter(c=>{
    const [hh,mm]=c[1].split(":").map(Number);return new Date(now.getFullYear(),now.getMonth(),now.getDate(),hh,mm)>now});
  $("#todayChips").innerHTML=list.length?list.map((c,i)=>`<button class="tchip" data-today="${dk}"><b>${c[1]}</b><span>${c[0]}</span></button>`).join(""):`<div class="nochip">${t("noToday")}</div>`;
}
document.addEventListener("click",e=>{const c=e.target.closest("[data-today]");if(c){cur=c.dataset.today;renderDays();renderClasses();go("schedule")}});
function chKey(){return "xfitm_ch_"+dkey(new Date())}
function chIsDone(){try{return localStorage.getItem(chKey())==="1"}catch(e){return false}}
function renderChallenge(){
  const i=new Date().getDay(),done=chIsDone();
  $("#chText").textContent=T[L].ch[i];
  $("#chal").classList.toggle("done",done);
  $("#chBtn").textContent=done?t("chDone"):t("chDoneBtn");
  $("#chE").textContent=done?"🏆":"🔥";
}
$("#chBtn").onclick=()=>{try{localStorage.setItem(chKey(),chIsDone()?"0":"1")}catch(e){}renderChallenge()};
function renderHome(){renderNext();renderToday();renderChallenge();qi++;showQuote()}
clearInterval(qTimer);qTimer=setInterval(()=>{qi++;showQuote()},5000);

applyStatic();renderDays();renderClasses();renderPlan();rvAvatars();rvPanel();renderHome();loadCounts();loadConfig();

/* ----- PWA: offline support ----- */
if("serviceWorker" in navigator&&location.protocol!=="file:"){
  addEventListener("load",()=>navigator.serviceWorker.register("service-worker.js").catch(()=>{}));
}
</script>
<script type="module">
/* ربط الحجز بحساب المشترك (إذا كانت مسجلة دخول). إذا فشل أي شي، الحجز العادي ما بتأثر */
import { auth, db, onAuthStateChanged, doc, getDoc, setDoc, collection, getDocs, serverTimestamp, liveBookings } from "./xfit-firebase.js";
import { deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const VAPID = "BEzY1cgRGxtpFcishvpIP_BPpDOmCe3E1_6bC-RwmA5qLpZ6js6QX0mtn2gNialh09hUNN7VYgA7kR-45NaiVBk";
let user = null;
let myMem = null;
const b64 = k => { const p = "=".repeat((4 - k.length % 4) % 4), r = atob((k + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(r, c => c.charCodeAt(0)); };
/* بنحفظ اشتراك الإشعارات + حجوزاتها القادمة على حساب المشترك، والسيرفر بيبعت التذكير */
async function syncPush() {
  if (!user || !("Notification" in window) || Notification.permission !== "granted") return;
  const reg = await navigator.serviceWorker.ready, sub = await reg.pushManager.getSubscription();
  if (!sub) return;
  const up = (window.xfitMy ? window.xfitMy() : []).map(b => ({ key: b.key, cls: b.cls, time: b.time, start: b.date + "T" + b.time + ":00+03:00", at: b.at || null }));
  await setDoc(doc(db, "users", user.uid), { push: JSON.parse(JSON.stringify(sub)), lang: window.xfitLang(), up }, { merge: true });
}
window.xfitEnablePush = async () => {
  try {
    if (await Notification.requestPermission() === "granted") {
      const reg = await navigator.serviceWorker.ready;
      if (!(await reg.pushManager.getSubscription()))
        await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(VAPID) });
      await syncPush();
    }
  } catch (e) {}
  if (window.xfitRenderNext) window.xfitRenderNext();
};
function mkCard(title, text) {
  const c = document.createElement("div"); c.className = "cls priv";
  const h = document.createElement("div"); h.className = "meta"; h.style.fontWeight = "800"; h.textContent = title;
  const p = document.createElement("div"); p.className = "meta"; p.style.whiteSpace = "pre-wrap"; p.style.lineHeight = "1.9"; p.textContent = text;
  c.append(h, p); return c;
}
function renderPrivate() {
  document.querySelectorAll(".priv").forEach(n => n.remove());
  const plan = document.querySelector("#plan"), nut = document.querySelector("#nutrition .cls:not(.priv)");
  if (plan) plan.style.display = ""; if (nut) nut.style.display = "";
  const m = myMem; if (!m || m.type !== "private") return;
  const ar = document.documentElement.lang === "ar";
  if (m.schedule && plan) { plan.style.display = "none"; plan.before(mkCard(ar ? "برنامجك الخاص 💎" : "Your private plan 💎", m.schedule)); }
  if (m.nutrition && nut) { nut.style.display = "none"; nut.before(mkCard(ar ? "خطتك الغذائية 💎" : "Your nutrition plan 💎", m.nutrition)); }
}
new MutationObserver(renderPrivate).observe(document.documentElement, { attributes: true, attributeFilter: ["lang"] });
onAuthStateChanged(auth, async u => {
  /* الصفحة بس للمسجّلات: بدون حساب بنحوّل على صفحة إنشاء الحساب / الدخول */
  if (!u) { location.replace("account.html"); return; }
  document.documentElement.classList.remove("gate");
  checkCoach(u); checkOwner(u);
  user = u; myMem = null; renderPrivate();
  try { const pr = await getDoc(doc(db, "users", u.uid)); window.xfitProfile = pr.exists() ? { name: pr.data().name || "", phone: pr.data().phone || "" } : null; } catch (e) {}
  try { const s = await getDoc(doc(db, "memberships", u.uid)); myMem = s.exists() ? s.data() : null; renderPrivate(); } catch (e) {}
  try { const q = await getDocs(collection(db, "users", u.uid, "bookings")); const live = await liveBookings(u, q.docs); if (window.xfitSyncMy) window.xfitSyncMy(live.filter(d => !d.data().cancelled).map(d => { const x = d.data(); return { ...x, at: x.createdAt && x.createdAt.toDate ? x.createdAt.toDate().toISOString() : null }; })); await syncPush(); } catch (e) {}
});

/* ----- تبويب الكوتش: بيظهر بس إذا الحساب إيميل كوتش (السيرفر هو اللي بقرر) ----- */
const pad2 = n => String(n).padStart(2, "0"), fd = d => d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
let coDate = fd(new Date());
async function coApi(action, extra) {
  const idToken = await auth.currentUser.getIdToken();
  const res = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(Object.assign({ action, idToken }, extra || {})) });
  return res.json();
}
const CO_T = {
  ar: { nav: "حصصي", hi: n => "أهلاً " + n + " 👋 هاي حصصك والمتدربات", none: d => "ما عندك حصص بهاليوم (" + d + ")", off: "ملغاة", empty: "ما في حجوزات لسا", fail: "ما قدرت أحمّل الحصص، جرّب مرة ثانية", net: "ما في اتصال، جرّب مرة ثانية", tap: "اضغط لعرض الأسماء", loc: "ar-JO" },
  en: { nav: "My classes", hi: n => "Hi " + n + " 👋 Your classes & trainees", none: d => "No classes today (" + d + ")", off: "Cancelled", empty: "No bookings yet", fail: "Couldn't load the classes, please try again", net: "No connection, please try again", tap: "Tap to see names", loc: "en-US" }
};
const CO_DAYS_EN = { "السبت": "Saturday", "الأحد": "Sunday", "الاثنين": "Monday", "الثلاثاء": "Tuesday", "الأربعاء": "Wednesday", "الخميس": "Thursday", "الجمعة": "Friday" };
const coL = () => CO_T[document.documentElement.lang === "ar" ? "ar" : "en"];
let coWho = "", coData = null, coErr = "", coOpen = new Set();
function coDays() {
  const box = document.querySelector("#coDays"), out = [];
  for (let i = 0; i < 8; i++) {
    const d = new Date(); d.setDate(d.getDate() + i);
    const k = fd(d), b = document.createElement("button");
    b.type = "button"; b.className = "day" + (k === coDate ? " on" : ""); b.dataset.cd = k;
    b.textContent = d.toLocaleDateString(coL().loc, { weekday: "short", day: "numeric" });
    out.push(b);
  }
  box.replaceChildren(...out);
}
function coTexts() {
  const T = coL();
  document.querySelector("#navCoachTxt").textContent = T.nav;
  document.querySelector("#coName").textContent = coWho ? T.hi(coWho) : "";
}
/* بيرسم الحصص من آخر بيانات وصلت، بلغة الصفحة الحالية (بيتنادى عند تغيير اللغة بدون طلب جديد للسيرفر) */
function coRender() {
  const box = document.querySelector("#coList"), T = coL(); box.replaceChildren();
  const msg = t => { const p = document.createElement("div"); p.className = "empty"; p.textContent = t; box.appendChild(p); };
  if (coErr) return msg(T[coErr]);
  const r = coData; if (!r) return;
  if (!r.classes.length) return msg(T.none(document.documentElement.lang === "ar" ? r.day : (CO_DAYS_EN[r.day] || r.day)));
  r.classes.forEach(c => {
    const id = r.date + "|" + c.time + "|" + c.cls, has = c.names.length > 0, open = coOpen.has(id);
    const card = document.createElement("div"); card.className = "cls";
    const top = document.createElement("div"); top.className = "top";
    const nm = document.createElement("span"); nm.className = "name"; nm.textContent = c.cls + " · " + c.time;
    const bd = document.createElement("span"); bd.className = "badge"; bd.textContent = (c.cancelled ? T.off : c.names.length + "/" + c.max) + (has ? (open ? "  ▴" : "  ▾") : "");
    top.append(nm, bd); card.appendChild(top);
    const meta = document.createElement("div"); meta.className = "meta";
    if (!has) meta.textContent = T.empty;
    else if (!open) { meta.textContent = T.tap; meta.style.opacity = ".7"; }
    else c.names.forEach((n, i) => { const l = document.createElement("div"); l.textContent = (i + 1) + ". " + n; meta.appendChild(l); });
    card.appendChild(meta);
    if (has) {
      card.style.cursor = "pointer"; card.setAttribute("role", "button"); card.tabIndex = 0;
      const flip = () => { if (coOpen.has(id)) coOpen.delete(id); else coOpen.add(id); coRender(); };
      card.onclick = flip;
      card.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); } };
    }
    box.appendChild(card);
  });
}
let coSeq = 0;
async function coLoad() {
  document.querySelector("#coList").replaceChildren();
  const my = ++coSeq;   /* لو انطلب تحميل ثاني قبل ما يخلص هاد، بنتجاهل نتيجة الأقدم (عشان ما تتكرر الحصص) */
  try {
    const r = await coApi("coachBookings", { date: coDate });
    if (my !== coSeq) return;
    if (!r.ok) { coData = null; coErr = "fail"; } else { coData = r; coErr = ""; }
  } catch (e) { if (my !== coSeq) return; coData = null; coErr = "net"; }
  coRender();
}
new MutationObserver(() => { if (coWho) { coTexts(); coDays(); coRender(); } }).observe(document.documentElement, { attributes: true, attributeFilter: ["lang"] });
document.addEventListener("click", e => {
  const d = e.target.closest("[data-cd]"); if (d) { coDate = d.dataset.cd; coDays(); coLoad(); return; }
  if (e.target.closest("#navCoach")) { coDays(); coLoad(); }
});
async function checkCoach(u) {
  document.querySelector("#navCoach").style.display = "none";
  try {
    const key = "xfitm_coach_" + u.uid; let c = sessionStorage.getItem(key);
    if (c === null) {
      /* نحاول مرتين، ونخزّن النتيجة بس إذا السيرفر ردّ ردّ واضح (كوتش أو مش كوتش) - الأخطاء المؤقتة ما بتتخزّن */
      let r = null;
      for (let i = 0; i < 2 && !r; i++) { try { r = await coApi("coachWho"); } catch (e) { r = null; } if (!r && i === 0) await new Promise(f => setTimeout(f, 1200)); }
      if (r && r.ok) { c = r.coach || ""; sessionStorage.setItem(key, c); }
      else if (r && r.error === "denied") { c = ""; sessionStorage.setItem(key, c); }
      else c = "";
    }
    if (!c) return;
    coWho = c; coTexts();
    document.querySelector("#navCoach").style.display = "";
    coDays(); coLoad();
    if (!sessionStorage.getItem("xfitm_co_open")) { sessionStorage.setItem("xfitm_co_open", "1"); go("coach"); }
  } catch (e) {}
}

/* ----- تبويب الأدمن: بيظهر بس لإيميل الأدمن (السيرفر بيتأكد من التوكن) ----- */
async function checkOwner(u) {
  document.querySelector("#navAdmin").style.display = "none";
  try {
    const key = "xfitm_owner_" + u.uid; let o = sessionStorage.getItem(key);
    if (o === null) {
      let r = null;
      for (let i = 0; i < 2 && !r; i++) { try { r = await coApi("ownerWho"); } catch (e) { r = null; } if (!r && i === 0) await new Promise(f => setTimeout(f, 1200)); }
      if (r && r.ok) { o = "1"; sessionStorage.setItem(key, o); }
      else if (r && r.error === "denied") { o = ""; sessionStorage.setItem(key, o); }
      else o = "";
    }
    if (!o) return;
    document.querySelector("#navAdmin").style.display = "";
    const f = document.querySelector("#admFrame"); if (f && !f.getAttribute("src")) f.src = f.dataset.src;   /* لوحة الإدارة الكاملة جوّا التبويب */
    if (!sessionStorage.getItem("xfitm_ad_open")) { sessionStorage.setItem("xfitm_ad_open", "1"); go("adm"); }
  } catch (e) {}
}
let lastMine = 0;
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState !== "visible" || !user || Date.now() - lastMine < 30000) return;
  lastMine = Date.now();
  try {
    const q = await getDocs(collection(db, "users", user.uid, "bookings")), live = await liveBookings(user, q.docs);
    if (window.xfitSyncMy) window.xfitSyncMy(live.filter(d => !d.data().cancelled).map(d => { const x = d.data(); return { ...x, at: x.createdAt && x.createdAt.toDate ? x.createdAt.toDate().toISOString() : null }; }));
    await syncPush();
  } catch (e) {}
});
window.xfitOnCancelled = async key => {
  if (!user) return;
  const ref = doc(db, "users", user.uid, "bookings", key.replace(/[\/|]/g, "_"));
  try { await deleteDoc(ref); } catch (e) { try { await setDoc(ref, { cancelled: true }, { merge: true }); } catch (e2) {} }
  try { await syncPush(); } catch (e) {}
};
window.xfitOnBooked = async b => {
  if (!user) return;
  try {
    await setDoc(doc(db, "users", user.uid, "bookings", b.key.replace(/[\/|]/g, "_")),
      { key: b.key, cls: b.cls, day: b.day, time: b.time, date: b.key.split("|")[0], createdAt: serverTimestamp() });
  } catch (e) {}
  try { await syncPush(); } catch (e) {}
};
</script>
